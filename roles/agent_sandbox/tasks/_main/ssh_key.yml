---
- name: Ensure the agent .ssh directory exists
  ansible.builtin.file:
    path: "{{ agent_sandbox_home }}/.ssh"
    state: directory
    owner: "{{ agent_sandbox_user }}"
    group: "{{ agent_sandbox_user }}"
    mode: "0700"

# In check mode on a new host the agent user is only simulated, and become_user can't switch to it
- name: Look up the agent user in check mode
  ansible.builtin.getent:
    database: passwd
    key: "{{ agent_sandbox_user }}"
    fail_key: false
  when: ansible_check_mode

# The private key never leaves the host. It is only generated when missing, so re-provisioning keeps it and the
# deploy keys added for it; a rebuilt host gets a new one
- name: Generate the agent SSH key if missing
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - "{{ agent_sandbox_user }}@{{ inventory_hostname }}"
      - -f
      - "{{ agent_sandbox_home }}/.ssh/id_ed25519"
    creates: "{{ agent_sandbox_home }}/.ssh/id_ed25519"
  become: true
  become_user: "{{ agent_sandbox_user }}"
  when: >-
    not ansible_check_mode
    or (ansible_facts['getent_passwd'] | default({})).get(agent_sandbox_user) is not none
