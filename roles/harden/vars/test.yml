---
# Test vars for the Molecule scenario, loaded with vars_from: test; the role itself never loads them
harden_enable: true
# One extra port per form: default proto and comment, UDP with its own comment, any protocol without a comment
harden_ufw_allowed_ports:
  - port: 443
  - port: 51820
    proto: udp
    comment: WireGuard
  - port: 53
    proto: any
    comment: ""
