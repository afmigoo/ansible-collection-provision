---
# Builds the agent file list the files verification below checks
- name: Preparation
  ansible.builtin.import_tasks: preparation.yml
  tags: [agent_sandbox, agent_sandbox_verify]

- name: Probe the agent
  tags: [agent_sandbox, agent_sandbox_verify]
  block:
    - name: List the agent's sudo rights
      ansible.builtin.command: sudo -n -l -U {{ agent_sandbox_user }}
      register: __agent_sandbox_sudo
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the agent's passwd entry
      ansible.builtin.getent:
        database: passwd
        key: "{{ agent_sandbox_user }}"
      failed_when: false

    - name: Stat the agent home
      ansible.builtin.stat:
        path: "{{ agent_sandbox_home }}"
      register: __agent_sandbox_home_stat

    - name: Stat the shared context directory
      ansible.builtin.stat:
        path: "{{ agent_sandbox_home }}/.agents"
      register: __agent_sandbox_context_stat

    # Only bash and fish get ~/.local/bin from this role
    - name: Print the PATH of the agent's login shell
      ansible.builtin.command:
        argv: ["{{ agent_sandbox_shell }}", -lc, echo $PATH]
        # $PATH is for the login shell, not the module
        expand_argument_vars: false
      become: true
      become_user: "{{ agent_sandbox_user }}"
      # As sudo -iu would
      environment:
        HOME: "{{ agent_sandbox_home }}"
      register: __agent_sandbox_path
      changed_when: false
      failed_when: false
      check_mode: false
      when: agent_sandbox_shell | basename in ['bash', 'fish']

    - name: Assert the agent
      ansible.builtin.assert:
        that:
          - "'is not allowed to run sudo' in __agent_sandbox_sudo.stdout"
          - _agent_sandbox_passwd[5] | default('') == agent_sandbox_shell
          - __agent_sandbox_home_stat.stat.pw_name | default('') == agent_sandbox_user
          - __agent_sandbox_home_stat.stat.mode | default('') == '0700'
          - __agent_sandbox_context_stat.stat.isdir | default(false)
          - __agent_sandbox_path is skipped or (agent_sandbox_home ~ '/.local/bin') in __agent_sandbox_path.stdout | default('')
        fail_msg: >-
          sudo: {{ __agent_sandbox_sudo.stdout_lines | first | default('') }},
          shell: {{ _agent_sandbox_passwd[5] | default('missing user') }},
          home: {{ __agent_sandbox_home_stat.stat.pw_name | default('missing') }} {{ __agent_sandbox_home_stat.stat.mode | default('') }},
          ~/.agents: {{ 'present' if __agent_sandbox_context_stat.stat.isdir | default(false) else 'missing' }},
          login PATH: {{ __agent_sandbox_path.stdout | default(__agent_sandbox_path.stderr | default('not checked')) }}
      vars:
        _agent_sandbox_passwd: "{{ (ansible_facts['getent_passwd'] | default({})).get(agent_sandbox_user) or [] }}"

- name: Check the agent SSH key
  when: agent_sandbox_enable_ssh_key | default(true) | bool
  tags: [agent_sandbox, agent_sandbox_verify]
  block:
    - name: Stat the agent SSH private key
      ansible.builtin.stat:
        path: "{{ agent_sandbox_home }}/.ssh/id_ed25519"
      register: __agent_sandbox_key_stat

    - name: Derive the public key from the private key
      ansible.builtin.command:
        argv: [ssh-keygen, -y, -f, "{{ agent_sandbox_home }}/.ssh/id_ed25519"]
      become: true
      become_user: "{{ agent_sandbox_user }}"
      register: __agent_sandbox_key_derived
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the agent SSH public key
      ansible.builtin.slurp:
        src: "{{ agent_sandbox_home }}/.ssh/id_ed25519.pub"
      register: __agent_sandbox_key_pub
      failed_when: false

    - name: Assert the agent SSH key
      ansible.builtin.assert:
        that:
          - __agent_sandbox_key_stat.stat.exists
          - __agent_sandbox_key_stat.stat.pw_name == agent_sandbox_user
          - __agent_sandbox_key_stat.stat.mode == '0600'
          - __agent_sandbox_key_derived.rc == 0
          - >-
            (__agent_sandbox_key_pub.content | default('') | b64decode).split()[:2]
            == __agent_sandbox_key_derived.stdout.split()[:2]
        fail_msg: >-
          {{ agent_sandbox_home }}/.ssh/id_ed25519 is missing, not owned by {{ agent_sandbox_user }} with mode 0600,
          unreadable ({{ __agent_sandbox_key_derived.stderr | default('') }}) or doesn't match id_ed25519.pub

- name: Check the skills
  when:
    - agent_sandbox_enable_context | default(true) | bool
    - agent_sandbox_skills | length > 0
  tags: [agent_sandbox, agent_sandbox_verify]
  block:
    - name: Stat the skills
      ansible.builtin.stat:
        path: "{{ agent_sandbox_home }}/.agents/skills/{{ __agent_sandbox_skill.name }}/SKILL.md"
      loop: "{{ agent_sandbox_skills }}"
      loop_control:
        loop_var: __agent_sandbox_skill
        label: "{{ __agent_sandbox_skill.name }}"
      register: __agent_sandbox_skill_stat

    - name: Assert the skills
      ansible.builtin.assert:
        that: __agent_sandbox_missing | length == 0
        fail_msg: "Skills without ~/.agents/skills/<name>/SKILL.md: {{ __agent_sandbox_missing | join(', ') }}"
      vars:
        __agent_sandbox_missing: >-
          {{ __agent_sandbox_skill_stat.results | rejectattr('stat.exists') | map(attribute='__agent_sandbox_skill.name') | list }}

# Global rules, commands, the PATH snippet and agent_sandbox_files
- name: Verify the agent files
  ansible.builtin.include_role:
    name: afmigoo.provision.files
    tasks_from: verification
    apply:
      tags: [agent_sandbox, agent_sandbox_verify]
  vars:
    files_list: "{{ _agent_sandbox_files_list }}"
  when: _agent_sandbox_files_list | length > 0
  tags: [agent_sandbox, agent_sandbox_verify]
