---
# The agent user and the shared context claude_sandbox and opencode_sandbox expect, from agent_sandbox without podman
# and the SSH key. Imported by their scenarios' prepare.yml
- name: Prepare
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Run the agent_sandbox role
      ansible.builtin.import_role:
        name: afmigoo.provision.agent_sandbox
      vars:
        agent_sandbox_enable: true
        agent_sandbox_enable_podman: false
        agent_sandbox_enable_ssh_key: false
        agent_sandbox_global_rules: "# Global rules (Molecule test)\n"
        agent_sandbox_skills:
          - name: local-skill
            src: "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/../fixtures/agent_sandbox/skills/local-skill"
        agent_sandbox_commands:
          - name: hello
            content: "Say hello to $ARGUMENTS.\n"
