---
# Master gate, the role does nothing unless enabled. Run afmigoo.provision.agent_sandbox first
claude_sandbox_enable: false

# Link ~/.claude/CLAUDE.md, skills and commands to the shared context in ~/.agents
claude_sandbox_enable_links: true

claude_sandbox_user: "{{ agent_sandbox_user | default('agent') }}"
claude_sandbox_home: "{{ agent_sandbox_home | default('/home/' ~ claude_sandbox_user) }}"

# A release such as "2.1.280", or "latest", which installs the newest release once and never upgrades it
claude_sandbox_version: "2.1.280"

# ~/.claude/settings.json; empty leaves the file alone
claude_sandbox_settings: {}

# Plugin marketplaces and plugins, installed with `claude plugin` as the agent (user scope), e.g.
#   claude_sandbox_marketplaces:
#     - name: claude-plugins-official                                # the name the marketplace declares
#       source: https://github.com/anthropics/claude-plugins-official.git
#   claude_sandbox_plugins:
#     - commit-commands@claude-plugins-official                      # plugin@marketplace
claude_sandbox_marketplaces: []
claude_sandbox_plugins: []
