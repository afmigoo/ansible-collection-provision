---
# Runs the verification entry point of every role whose master gate is enabled,
# e.g. ansible-playbook afmigoo.provision.verify -e harden_enable=true
- name: Verify provisioned hosts
  hosts: "{{ provision_hosts | default('all') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Verify base setup
      ansible.builtin.include_role:
        name: afmigoo.provision.base
        tasks_from: verification
        apply:
          tags: [verify]
      when: base_enable | default(false) | bool
      tags: [verify]

    - name: Verify hardening
      ansible.builtin.include_role:
        name: afmigoo.provision.harden
        tasks_from: verification
        apply:
          tags: [verify]
      when: harden_enable | default(false) | bool
      tags: [verify]

    - name: Verify podman
      ansible.builtin.include_role:
        name: afmigoo.provision.podman
        tasks_from: verification
        apply:
          tags: [verify]
      when: podman_enable | default(false) | bool
      tags: [verify]

    - name: Verify agent sandbox
      ansible.builtin.include_role:
        name: afmigoo.provision.agent_sandbox
        tasks_from: verification
        apply:
          tags: [verify]
      when: agent_sandbox_enable | default(false) | bool
      tags: [verify]

    - name: Verify Claude Code
      ansible.builtin.include_role:
        name: afmigoo.provision.claude_sandbox
        tasks_from: verification
        apply:
          tags: [verify]
      when: claude_sandbox_enable | default(false) | bool
      tags: [verify]

    - name: Verify opencode
      ansible.builtin.include_role:
        name: afmigoo.provision.opencode_sandbox
        tasks_from: verification
        apply:
          tags: [verify]
      when: opencode_sandbox_enable | default(false) | bool
      tags: [verify]

    - name: Verify Vagrant
      ansible.builtin.include_role:
        name: afmigoo.provision.vagrant_session
        tasks_from: verification
        apply:
          tags: [verify]
      when: vagrant_session_enable | default(false) | bool
      tags: [verify]

    - name: Verify files
      ansible.builtin.include_role:
        name: afmigoo.provision.files
        tasks_from: verification
        apply:
          tags: [verify]
      when: files_enable | default(false) | bool
      tags: [verify]
