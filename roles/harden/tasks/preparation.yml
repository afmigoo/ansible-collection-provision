---
- name: Gather facts
  ansible.builtin.setup:
    gather_subset: [min]

- name: Check that the host is Debian
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    fail_msg: "afmigoo.provision.harden supports Debian only, got {{ ansible_facts['os_family'] }}"
    quiet: true

# The argument spec checks the entries' keys and types but can't check a range
- name: Check that the extra ufw ports are in range
  ansible.builtin.assert:
    that: __harden_rule.port | int >= 1 and __harden_rule.port | int <= 65535
    fail_msg: "harden_ufw_allowed_ports: port {{ __harden_rule.port }} is not in 1-65535"
    quiet: true
  loop: "{{ harden_ufw_allowed_ports }}"
  loop_control:
    loop_var: __harden_rule
    label: "{{ __harden_rule.port }}"
  when: harden_enable_ufw | bool
