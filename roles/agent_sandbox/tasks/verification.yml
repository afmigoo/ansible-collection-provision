---
- name: Probe the agent tools
  tags: [agent_sandbox, agent_sandbox_verify]
  block:
    - name: Run claude --version as the agent
      ansible.builtin.command: "{{ agent_sandbox_home }}/.local/bin/claude --version"
      become: true
      become_user: "{{ agent_sandbox_user }}"
      register: __agent_sandbox_claude
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Run opencode --version
      ansible.builtin.command: /usr/local/bin/opencode --version
      register: __agent_sandbox_opencode
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Run sops --version
      ansible.builtin.command: sops --version
      register: __agent_sandbox_sops
      changed_when: false
      failed_when: false
      check_mode: false
      when: agent_sandbox_enable_sops | default(true) | bool

    - name: List the agent's sudo rights
      ansible.builtin.command: sudo -n -l -U {{ agent_sandbox_user }}
      register: __agent_sandbox_sudo
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Assert the agent tools
      ansible.builtin.assert:
        that:
          - agent_sandbox_claude_version in __agent_sandbox_claude.stdout | default('')
          - agent_sandbox_opencode_version in __agent_sandbox_opencode.stdout | default('')
          - "'is not allowed to run sudo' in __agent_sandbox_sudo.stdout"
          - not (agent_sandbox_enable_sops | default(true) | bool) or agent_sandbox_sops_version in __agent_sandbox_sops.stdout | default('')
        fail_msg: >-
          claude: {{ __agent_sandbox_claude.stdout | default(__agent_sandbox_claude.msg | default('')) }},
          opencode: {{ __agent_sandbox_opencode.stdout | default(__agent_sandbox_opencode.msg | default('')) }},
          sops: {{ __agent_sandbox_sops.stdout | default(__agent_sandbox_sops.msg | default('')) }},
          sudo: {{ __agent_sandbox_sudo.stdout_lines | first | default('') }}

- name: Check the agent SSH key
  when: agent_sandbox_enable_ssh_key | default(true) | bool
  tags: [agent_sandbox, agent_sandbox_verify]
  block:
    - name: Stat the agent SSH private key
      ansible.builtin.stat:
        path: "{{ agent_sandbox_home }}/.ssh/id_ed25519"
      register: __agent_sandbox_key_stat

    - name: Derive the public key from the private key
      ansible.builtin.command:
        argv: [ssh-keygen, -y, -f, "{{ agent_sandbox_home }}/.ssh/id_ed25519"]
      become: true
      become_user: "{{ agent_sandbox_user }}"
      register: __agent_sandbox_key_derived
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the agent SSH public key
      ansible.builtin.slurp:
        src: "{{ agent_sandbox_home }}/.ssh/id_ed25519.pub"
      register: __agent_sandbox_key_pub
      failed_when: false

    - name: Assert the agent SSH key
      ansible.builtin.assert:
        that:
          - __agent_sandbox_key_stat.stat.exists
          - __agent_sandbox_key_stat.stat.pw_name == agent_sandbox_user
          - __agent_sandbox_key_stat.stat.mode == '0600'
          - __agent_sandbox_key_derived.rc == 0
          - >-
            (__agent_sandbox_key_pub.content | default('') | b64decode).split()[:2]
            == __agent_sandbox_key_derived.stdout.split()[:2]
        fail_msg: >-
          {{ agent_sandbox_home }}/.ssh/id_ed25519 is missing, not owned by {{ agent_sandbox_user }} with mode 0600,
          unreadable ({{ __agent_sandbox_key_derived.stderr | default('') }}) or doesn't match id_ed25519.pub

- name: Probe the Vagrant setup
  when: agent_sandbox_enable_vagrant | default(false) | bool
  tags: [agent_sandbox, agent_sandbox_verify]
  block:
    - name: List the agent's Vagrant plugins
      ansible.builtin.command: vagrant plugin list
      become: true
      become_user: "{{ agent_sandbox_user }}"
      register: __agent_sandbox_vagrant
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the kvm group
      ansible.builtin.getent:
        database: group
        key: kvm
      failed_when: false

    - name: Check the libvirt default network
      ansible.builtin.command: virsh --connect qemu:///system net-info default
      register: __agent_sandbox_net
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Stat the bridge helper
      ansible.builtin.stat:
        path: /usr/lib/qemu/qemu-bridge-helper
      register: __agent_sandbox_bridge_helper

    - name: Read the bridge ACL
      ansible.builtin.slurp:
        src: /etc/qemu/bridge.conf
      register: __agent_sandbox_bridge_conf
      failed_when: false

    - name: Assert the Vagrant setup
      ansible.builtin.assert:
        that:
          - "'vagrant-libvirt' in __agent_sandbox_vagrant.stdout | default('')"
          - agent_sandbox_user in ((ansible_facts['getent_group'] | default({})).get('kvm') or ['', '', ''])[2].split(',')
          - __agent_sandbox_net.stdout | default('') is search('Active:\s+yes')
          - __agent_sandbox_bridge_helper.stat.mode | default('') == '4755'
          - __agent_sandbox_bridge_helper.stat.pw_name | default('') == 'root'
          - (__agent_sandbox_bridge_conf.content | default('') | b64decode | trim) == 'allow virbr0'
        fail_msg: >-
          vagrant plugins: {{ __agent_sandbox_vagrant.stdout | default(__agent_sandbox_vagrant.msg | default('')) }},
          kvm group: {{ (ansible_facts['getent_group'] | default({})).get('kvm') }},
          default network: {{ __agent_sandbox_net.stdout_lines | default([]) | select('search', 'Active') | first | default('missing') }},
          bridge helper mode: {{ __agent_sandbox_bridge_helper.stat.mode | default('missing') }},
          bridge.conf: {{ __agent_sandbox_bridge_conf.content | default('') | b64decode | trim }}
        quiet: true
