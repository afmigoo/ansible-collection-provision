---
# Tests the files role alone: converge and verify run it with roles/files/vars/test.yml (vars_from: test), then
# idempotence, its verification entry point and a check of the fixture contents. It copies a plain, a vault and three
# sops-encrypted fixtures (yaml, dotenv, text); decrypting them needs the sops binary on the control machine. The
# fixtures' age key and vault password are throwaway test secrets.
provisioner:
  name: ansible
  env:
    SOPS_AGE_KEY_FILE: ${MOLECULE_SCENARIO_DIRECTORY}/../fixtures/age-key.txt
  config_options:
    defaults:
      vault_password_file: ${MOLECULE_SCENARIO_DIRECTORY}/../fixtures/vault-password
