---
- name: Look up the users
  ansible.builtin.getent:
    database: passwd
  check_mode: false

# In check mode an earlier role may only have simulated them
- name: Check the rootless users
  ansible.builtin.assert:
    that: ansible_check_mode or podman_rootless_users | difference(ansible_facts['getent_passwd'].keys() | list) | length == 0
    fail_msg: "podman_rootless_users must exist, missing: {{ podman_rootless_users | difference(ansible_facts['getent_passwd'].keys() | list) }}"
    quiet: true

- name: Read the unprivileged user namespace switch
  ansible.builtin.slurp:
    src: /proc/sys/kernel/unprivileged_userns_clone
  register: __podman_userns
  failed_when: false
  when: podman_rootless_users | length > 0

- name: Check that rootless podman can create user namespaces
  ansible.builtin.assert:
    that:
      - __podman_userns.content is not defined or (__podman_userns.content | b64decode | trim) != '0'
    fail_msg: >-
      kernel.unprivileged_userns_clone is 0, so rootless podman cannot start. devsec os_hardening sets it;
      with afmigoo.provision.harden set harden_os_allow_userns: true.
    quiet: true
  when: podman_rootless_users | length > 0
