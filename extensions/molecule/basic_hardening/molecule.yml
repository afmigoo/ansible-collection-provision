---
# Converge with the afmigoo.provision.basic_hardening playbook, check idempotence, then run afmigoo.provision.verify.
# The toggles below tell the verify playbook which roles to check.
# converge.yml and verify.yml load roles/harden/vars/test.yml (extra ufw ports) before their playbooks.
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        base_enable: true
        harden_enable: true
