---
- name: Gather facts
  ansible.builtin.setup:
    gather_subset: [min]

- name: Check the preconditions
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - agent_sandbox_ssh_key_dir | length > 0 or not (agent_sandbox_enable_ssh_key | bool)
    fail_msg: >-
      Needs Debian (got {{ ansible_facts['os_family'] }}) and agent_sandbox_ssh_key_dir set to a directory on the
      control machine.
    quiet: true

- name: Set host wording
  ansible.builtin.set_fact:
    _agent_sandbox_host_word: "{{ 'VM' if agent_sandbox_host_kind == 'vm' else 'server' }}"
