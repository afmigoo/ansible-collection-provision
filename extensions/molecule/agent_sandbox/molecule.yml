---
# Converge with the afmigoo.provision.agent_sandbox playbook, check idempotence, then run afmigoo.provision.verify.
# The toggles below tell the verify playbook which roles to check.
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        base_enable: true
        harden_enable: true
        agent_sandbox_enable: true
        podman_enable: true
        podman_rootless_users: [agent]
        podman_verify_image: docker.io/library/busybox:1.37
        agent_sandbox_host_kind: vm
        # The git SSH key needs a vault password, which a test run does not have
        agent_sandbox_enable_ssh_key: false
