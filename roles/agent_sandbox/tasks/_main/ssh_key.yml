---
# Runs for every host, so each can have its own key directory; one host at a time, so hosts
# sharing a directory don't generate the key twice
- name: Prepare the agent SSH key on the control machine
  delegate_to: localhost
  become: false
  throttle: 1
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  block:
    - name: Ensure the key directory exists
      ansible.builtin.file:
        path: "{{ agent_sandbox_ssh_key_dir }}"
        state: directory
        mode: "0700"

    # The key lives on the control machine so it survives a host rebuild; it is only
    # generated when missing, an existing key is reused as is. Encrypt it with ansible-vault or sops afterwards
    - name: Generate the agent SSH key if missing
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - "{{ agent_sandbox_user }}@{{ inventory_hostname }}"
          - -f
          - "{{ agent_sandbox_ssh_key_dir }}/id_ed25519"
        creates: "{{ agent_sandbox_ssh_key_dir }}/id_ed25519"

    # A SOPS-encrypted file needs the community.sops lookup; anything else (vault-encrypted or plain) goes through
    # copy, which decrypts vault files itself. The file lookup decrypts vault too, so only the result is kept
    - name: Detect a SOPS-encrypted private key
      ansible.builtin.set_fact:
        __agent_sandbox_ssh_key_sops: >-
          {{ lookup('ansible.builtin.file', agent_sandbox_ssh_key_dir + '/id_ed25519') is search('"sops"\s*:') }}

- name: Ensure the agent .ssh directory exists
  ansible.builtin.file:
    path: "{{ agent_sandbox_home }}/.ssh"
    state: directory
    owner: "{{ agent_sandbox_user }}"
    group: "{{ agent_sandbox_user }}"
    mode: "0700"

- name: Install the agent SSH private key from a SOPS-encrypted file
  ansible.builtin.copy:
    # rstrip=false keeps the trailing newline, without it OpenSSH rejects the key
    content: >-
      {{ lookup('community.sops.sops', agent_sandbox_ssh_key_dir + '/id_ed25519',
                input_type='binary', output_type='binary', rstrip=false) }}
    dest: "{{ agent_sandbox_home }}/.ssh/id_ed25519"
    owner: "{{ agent_sandbox_user }}"
    group: "{{ agent_sandbox_user }}"
    mode: "0600"
  no_log: true
  when: __agent_sandbox_ssh_key_sops | bool

- name: Install the agent SSH private key
  ansible.builtin.copy:
    src: "{{ agent_sandbox_ssh_key_dir }}/id_ed25519"
    dest: "{{ agent_sandbox_home }}/.ssh/id_ed25519"
    owner: "{{ agent_sandbox_user }}"
    group: "{{ agent_sandbox_user }}"
    mode: "0600"
  when: not (__agent_sandbox_ssh_key_sops | bool)

- name: Install the agent SSH public key
  ansible.builtin.copy:
    src: "{{ agent_sandbox_ssh_key_dir }}/id_ed25519.pub"
    dest: "{{ agent_sandbox_home }}/.ssh/id_ed25519.pub"
    owner: "{{ agent_sandbox_user }}"
    group: "{{ agent_sandbox_user }}"
    mode: "0644"
