---
- name: Agent sandbox
  when: agent_sandbox_enable | bool
  block:
    - name: Preparation
      ansible.builtin.import_tasks: preparation.yml
      tags: [agent_sandbox, always]

    - name: Agent user
      ansible.builtin.import_tasks: _main/user.yml
      tags: [agent_sandbox, agent_sandbox_user]

    - name: Rootless podman
      ansible.builtin.import_tasks: _main/podman.yml
      when: agent_sandbox_enable_podman | bool
      tags: [agent_sandbox, agent_sandbox_podman]

    - name: Agent SSH key
      ansible.builtin.import_tasks: _main/ssh_key.yml
      when: agent_sandbox_enable_ssh_key | bool
      tags: [agent_sandbox, agent_sandbox_ssh_key]

    - name: Skills
      ansible.builtin.import_tasks: _main/skills.yml
      when: agent_sandbox_enable_context | bool
      tags: [agent_sandbox, agent_sandbox_context]

    # Global rules, commands, the shell's PATH snippet and agent_sandbox_files
    - name: Agent files
      ansible.builtin.import_tasks: _main/files.yml
      tags: [agent_sandbox, agent_sandbox_files, agent_sandbox_context]

    - name: Summary
      ansible.builtin.import_tasks: _main/summary.yml
      tags: [agent_sandbox]
