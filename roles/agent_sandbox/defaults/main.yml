---
# Master gate, the role does nothing unless enabled
agent_sandbox_enable: false

# Rootless podman for the agent, set up with afmigoo.provision.podman
agent_sandbox_enable_podman: true
# Generate the agent's git SSH key on the host; its public key is printed at the end
agent_sandbox_enable_ssh_key: true
# The shared agent context in ~/.agents: global rules, skills and commands
agent_sandbox_enable_context: true

agent_sandbox_user: agent
agent_sandbox_home: "/home/{{ agent_sandbox_user }}"
# Login shell; another shell than bash needs its package, e.g. base_extra_packages: [fish]
agent_sandbox_shell: /bin/bash

# Global rules for every agent, ~/.agents/AGENTS.md: inline text, or the absolute path of a Jinja template on the
# control machine. Set at most one; with neither the file isn't managed.
agent_sandbox_global_rules: ""
agent_sandbox_global_rules_template: ""

# Skills, mirrored to ~/.agents/skills/<name>/ (files the source no longer has are removed), e.g.
#   - name: my-skill
#     src: "{{ inventory_dir }}/../skills/my-skill"   # directory on the control machine, absolute
#   - name: other-skill
#     git: https://github.com/org/skills.git           # cloned on the host as the agent
#     version: v1.2.0                                  # branch, tag or commit; default HEAD
#     path: skills/other-skill                         # subdirectory holding the skill; default the repo root
agent_sandbox_skills: []

# Slash commands, ~/.agents/commands/<name>.md, e.g.
#   - name: remember
#     content: "Save this to memory: $ARGUMENTS\n"   # or src: absolute path on the control machine
agent_sandbox_commands: []

# More files for the agent, entries as in files_list (afmigoo.provision.files) with these defaults: a relative dest is
# under the agent home, owner and group are the agent, create_dirs is true
agent_sandbox_files: []
