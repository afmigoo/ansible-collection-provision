---
argument_specs:
  main:
    short_description: Copy files to the host
    description:
      - Puts files on the host, copied from the control machine (plain, ansible-vault encrypted or sops-encrypted; the
        format is detected from its content), rendered from a Jinja template on the control machine (plain or
        ansible-vault encrypted) or written from an inline string.
      - Sops-encrypted sources are decrypted with the community.sops lookup, which needs the sops binary and the
        decryption key on the control machine. Vault-encrypted sources and templates need a vault password.
      - Checks the sources, owners, groups and destination directories before copying, creates new files with their
        owner and mode before writing content, and never shows diffs.
    author: afmigoo
    options: &files_options
      files_enable:
        type: bool
        default: false
        description: Master gate; the role does nothing unless true.
      files_list:
        type: list
        elements: dict
        default: []
        description: Files to put on the host. Each entry has exactly one of src, template or content.
        options:
          src:
            type: str
            description: Absolute path of a file on the control machine to copy (plain, ansible-vault or sops-encrypted).
          template:
            type: str
            description:
              - Absolute path of a Jinja template on the control machine (plain or ansible-vault encrypted, not sops).
              - Rendered with lstrip_blocks on, with the host's variables.
          content:
            type: str
            description: Content of the file.
          dest:
            type: str
            required: true
            description:
              - Absolute path of a file on the host (not a directory or symlink). No two entries may share it.
              - Its directory must exist unless create_dirs is true.
          owner:
            type: str
            default: root
            description: Owner of the file on the host.
          group:
            type: str
            default: root
            description: Group of the file on the host.
          mode:
            type: str
            default: "0600"
            description: Mode of the file on the host, quoted (e.g. "0640").
          force:
            type: bool
            default: true
            description:
              - Write the content on every run. When false the content is only written when the file is missing, for
                seeded files that are edited on the host later (owner and mode are still set).
          create_dirs:
            type: bool
            default: false
            description:
              - Create the missing directories of dest, with the entry's owner and group and dir_mode. Directories that
                already exist are left as they are, and a failed run doesn't remove the ones it created.
          dir_mode:
            type: str
            default: "0755"
            description: Mode of the directories create_dirs makes, quoted.
  verification:
    short_description: Verify the copied files
    description:
      - Checks that every file in files_list is on the host with its content, owner, group and mode, by running the
        copy in check mode. Entries with force false are only checked for existence, owner and mode.
    author: afmigoo
    options: *files_options
