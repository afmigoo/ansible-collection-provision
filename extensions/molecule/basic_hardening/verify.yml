---
- name: Load the harden test vars
  hosts: all
  gather_facts: false
  tasks:
    # include_vars sets host vars, so they stay set for the imported playbook
    - name: Load roles/harden/vars/test.yml
      ansible.builtin.include_vars:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/../../../roles/harden/vars/test.yml"

- name: Verify
  ansible.builtin.import_playbook: afmigoo.provision.verify
