---
- name: Create the opencode config directories
  ansible.builtin.file:
    path: "{{ opencode_sandbox_home }}/{{ __opencode_sandbox_dir }}"
    state: directory
    owner: "{{ opencode_sandbox_user }}"
    group: "{{ opencode_sandbox_user }}"
    mode: "0755"
  loop: [.config, .config/opencode]
  loop_control:
    loop_var: __opencode_sandbox_dir

# No diff: the config may hold API keys
- name: Write the opencode config
  ansible.builtin.copy:
    content: "{{ opencode_sandbox_config | to_nice_json(indent=2) }}\n"
    dest: "{{ opencode_sandbox_home }}/.config/opencode/opencode.json"
    owner: "{{ opencode_sandbox_user }}"
    group: "{{ opencode_sandbox_user }}"
    mode: "0644"
  diff: false
  when: opencode_sandbox_config | length > 0
