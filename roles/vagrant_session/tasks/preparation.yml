---
- name: Gather facts
  ansible.builtin.setup:
    gather_subset: [min]

- name: Check the preconditions
  ansible.builtin.assert:
    that: ansible_facts['distribution'] == 'Debian'
    fail_msg: Needs Debian (got {{ ansible_facts['distribution'] }}), Ubuntu doesn't package Vagrant.
    quiet: true

- name: Look up the users
  ansible.builtin.getent:
    database: passwd
  check_mode: false

# In check mode an earlier role may only have simulated them
- name: Check the users
  ansible.builtin.assert:
    that: ansible_check_mode or vagrant_session_users | difference(ansible_facts['getent_passwd'].keys() | list) | length == 0
    fail_msg: "vagrant_session_users must exist, missing: {{ vagrant_session_users | difference(ansible_facts['getent_passwd'].keys() | list) }}"
    quiet: true

- name: Start the users' homes
  ansible.builtin.set_fact:
    _vagrant_session_homes: {}

# A user only simulated in check mode gets the usual home
- name: Remember the users' homes
  ansible.builtin.set_fact:
    _vagrant_session_homes: >-
      {{ _vagrant_session_homes | combine({__vagrant_session_user:
           (ansible_facts['getent_passwd'].get(__vagrant_session_user) or [])[4] | default('/home/' ~ __vagrant_session_user)}) }}
  loop: "{{ vagrant_session_users }}"
  loop_control:
    loop_var: __vagrant_session_user
