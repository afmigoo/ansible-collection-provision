---
- name: Read the agent SSH public key
  ansible.builtin.slurp:
    src: "{{ agent_sandbox_home }}/.ssh/id_ed25519.pub"
  register: __agent_sandbox_pubkey
  # Missing in check mode on a new host, where the key isn't generated
  failed_when: false
  when: agent_sandbox_enable_ssh_key | bool

- name: Show how to use the sandbox
  ansible.builtin.debug:
    msg:
      - "agent-sandbox ready: claude v{{ agent_sandbox_claude_version }}, opencode v{{ agent_sandbox_opencode_version }}"
      - "ssh to {{ inventory_hostname }}, then: sudo -iu {{ agent_sandbox_user }}, and run claude or opencode (log in on first start)"
      - "agent SSH public key (add it to your git hosts): {{ _agent_sandbox_pubkey }}"
  vars:
    _agent_sandbox_pubkey: >-
      {{ (__agent_sandbox_pubkey.content | b64decode | trim)
         if agent_sandbox_enable_ssh_key | bool and __agent_sandbox_pubkey.content is defined else 'n/a' }}
